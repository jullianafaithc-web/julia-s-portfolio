<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EdiDeliver – Forgot Password</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(to right, #007bff, #00bfff);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .forgot-box {
      background: white;
      padding: 30px 40px;
      border-radius: 10px;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.2);
      width: 340px;
      text-align: center;
      position: relative;
    }
    h2 {
      margin-bottom: 20px;
    }
    input, button {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      border: 1px solid #ccc;
      border-radius: 5px;
    }
    button {
      background: #007bff;
      color: white;
      border: none;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }
    button:hover {
      background: #0056b3;
    }
    .back-link {
      display: block;
      margin-top: 10px;
      font-size: 14px;
      color: #007bff;
      text-decoration: none;
    }
    .back-link:hover {
      text-decoration: underline;
    }
    .rocket {
      font-size: 40px;
      position: absolute;
      top: -35px;
      left: 50%;
      transform: translateX(-50%);
    }
  </style>
</head>
<body>
  <div class="forgot-box">
    <div class="rocket">🚀</div>
    <h2>Forgot Password</h2>
    <p>Enter your username or email to recover your password.</p>

    <input type="text" id="userInput" placeholder="Username or Email" />
    <button onclick="recover()">Recover Password</button>

    <a href="login.html" class="back-link">🔙 Back to Login</a>
  </div>

  <script>
    function recover() {
      const input = document.getElementById("userInput").value.trim();
      if (!input) {
        alert("⚠️ Please enter your username or email.");
        return;
      }

      const users = JSON.parse(localStorage.getItem("users")) || [];
      const found = users.find(
        u => u.username === input || u.email === input
      );

      if (found) {
        alert(`🔑 Your password for ${found.username} is: ${found.password}`);
      } else {
        alert("❌ No account found with that username or email.");
      }
    }
  </script>
</body>
</html>
